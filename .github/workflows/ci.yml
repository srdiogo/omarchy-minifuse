name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.17.3
      - run: ruff check client tests tools --select E4,E7,E9,F
      - run: ruff format --check client tests tools
      - run: python tools/check_project.py
      - run: python -m unittest discover -s tests -v
  host:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the tested runtime from an Arch repository snapshot
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/09/13/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm git python quickshell qt6-declarative curl inotify-tools ttf-dejavu
      - uses: actions/checkout@v4
      - name: Fetch the pinned host reference
        run: |
          python - <<'PY'
          import hashlib,json,tarfile,urllib.request
          from pathlib import Path
          lock=json.loads(Path('host.lock.json').read_text())
          data=urllib.request.urlopen(lock['archive_url'],timeout=60).read()
          assert hashlib.sha256(data).hexdigest()==lock['archive_sha256']
          Path('/tmp/host.tar.gz').write_bytes(data)
          with tarfile.open('/tmp/host.tar.gz') as archive:
              archive.extractall('/tmp/omarchy-reference',filter='data')
          PY
      - name: Check real host components without a desktop session
        env:
          QT_QUICK_BACKEND: software
        run: |
          quickshell --version
          python - <<'PY'
          import subprocess
          packages=subprocess.check_output(['pacman','-Q','quickshell','qt6-base','qt6-declarative'],text=True)
          assert 'quickshell 0.3.1-1' in packages and 'qt6-base 6.11.2-3' in packages and 'qt6-declarative 6.11.2-1' in packages,packages
          PY
          python tools/check_project.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell
          python tools/check_host.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell
          python tools/check_host.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell --width 600 --scenario direct
          python tools/check_host.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell --width 480 --scenario uncertain
          python tools/check_host.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell --scenario offline
          python tools/check_host.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell --scenario meters
          python tools/check_interactions.py --host /tmp/omarchy-reference/omarchy-c668141e9c42b13c80c9ca4ea108e11708c5e8a5/shell
